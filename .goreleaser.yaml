# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: orca-tasks
dist: .cache/dist

# The binary bundles modules whose licenses ask for their notices to go with
# it, so each release collects them into .cache/release/licenses for the
# archives and the image. github.com/xi2/xz is public domain, which needs no
# notice and which go-licenses can't classify.
before:
  hooks:
    - go-licenses save ./cmd/orca-tasks --save_path .cache/release/licenses --force --ignore github.com/xi2/xz --ignore github.com/leightweight/orca-tasks

builds:
  - id: orca-tasks
    main: ./cmd/orca-tasks
    binary: orca-tasks
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# The CLI ships as archives that `mise use github:leightweight/orca-tasks`
# can install; the server ships as an image.
archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: .cache/release/licenses/**/*
        dst: licenses
        info:
          mode: 0o644

dockers_v2:
  - images:
      - ghcr.io/leightweight/orca-tasks
    tags:
      - "{{ .Version }}"
    dockerfile: Dockerfile.release
    extra_files:
      - .config/docker
      - .cache/release/licenses
      - LICENSE
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: orca-tasks
      org.opencontainers.image.description: A task tracker that serves a Jira-compatible API to Orca
      org.opencontainers.image.source: https://github.com/leightweight/orca-tasks
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
    annotations:
      org.opencontainers.image.source: https://github.com/leightweight/orca-tasks
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

# Keyless signing with the GitHub Actions OIDC identity.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Commits go straight to main, so the notes come from commit subjects rather
# than merged pull requests. Switch back to github-native once work goes
# through pull requests.
changelog:
  use: git
  # Newest first, as git logs them, with short commit hashes.
  abbrev: 7
  filters:
    exclude:
      - "^(docs|test|ci|chore|refactor)(\\(.*\\))?!?:"
  groups:
    - title: Features
      regexp: "^feat(\\(.*\\))?!?:"
      order: 0
    - title: Security
      regexp: "^security(\\(.*\\))?!?:"
      order: 1
    - title: Fixes
      regexp: "^(fix|perf)(\\(.*\\))?!?:"
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: leightweight
    name: orca-tasks
  prerelease: auto
  # The workflow publishes the draft once its signed packslip is attached,
  # so no one sees a release that mise can't install yet.
  draft: true
