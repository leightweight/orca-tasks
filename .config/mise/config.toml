[settings]
# Required for [deps].
experimental = true

[tools]
"go:github.com/google/go-licenses/v2" = "2.0.1"
cosign = "3.1.4"
docker-compose = "5.7.0"
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.20.0"
helm = "4.3.1"
hk = "2.11.1"
pkl = "0.33.0"
rumdl = "0.3.2"
rust = "1.99.1"
sqlc = "1.31.1"
"cargo:https://github.com/jleight/steveql-fmt" = "rev:30abd0302ac82aae45d81bb85afc9c9ee886418e"

[env]
_.path = ["{{config_root}}/bin"]
RUMDL_CACHE_DIR = "{{config_root}}/.cache/rumdl"

[deps.go]
auto = true

[tasks.bootstrap]
description = "Install git hooks"
run = "hk install --mise"

[tasks.lint]
description = "Run all linters"
run = "hk check --all"

[tasks.lint-fix]
description = "Run all linters and fix issues"
alias = "fix"
run = "hk fix --all"

[tasks.build]
description = "Build orca-tasks into bin/orca-tasks"
run = "go build -ldflags '-X main.version=dev' -o bin/orca-tasks ./cmd/orca-tasks"

[tasks.generate]
description = "Generate the query code in internal/store/db from the SQL"
run = "sqlc generate -f .config/sqlc.yaml"

[tasks."oat:update"]
description = "Vendor a version of the Oat stylesheet and script the web interface uses"
usage = 'arg "[version]" default="latest" help="An @knadh/oat version, such as 1.1.0"'
run = """
set -eu
version="${usage_version}"
if [ "$version" = latest ]; then
  version=$(curl -fsS https://registry.npmjs.org/@knadh/oat/latest | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
fi
dir=internal/web/static/oat
curl -fsS "https://cdn.jsdelivr.net/npm/@knadh/oat@${version}/oat.min.css" -o "$dir/oat.min.css"
curl -fsS "https://cdn.jsdelivr.net/npm/@knadh/oat@${version}/oat.min.js" -o "$dir/oat.min.js"
curl -fsS "https://cdn.jsdelivr.net/npm/@knadh/oat@${version}/LICENSE" -o "$dir/LICENSE"
echo "$version" > "$dir/VERSION"
echo "Vendored Oat $version."
"""

[tasks.docker-build]
description = "Build the image from source"
usage = 'arg "[image]" default="orca-tasks:dev" help="Image name and tag"'
run = 'docker build -t "${usage_image}" .'

[tasks."release:snapshot"]
description = "Build the release binaries and images locally without publishing them"
run = "goreleaser release --snapshot --clean"

[tasks.up]
description = "Build the image and run it with Postgres on http://localhost:8090"
run = "docker-compose up --build"

[tasks.down]
description = "Stop the local server and Postgres, keeping their data"
usage = 'flag "--wipe" help="Also delete the database and attachments"'
run = 'if [ "${usage_wipe:-false}" = true ]; then docker-compose down --volumes; else docker-compose down; fi'
