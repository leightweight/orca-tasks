# sqlc generates internal/store/db from the migrations and the queries.
version: "2"
sql:
  - engine: postgresql
    schema: ../internal/store/migrations
    queries: ../internal/store/queries
    gen:
      go:
        package: db
        out: ../internal/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
