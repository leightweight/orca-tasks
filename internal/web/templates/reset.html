{{define "content"}}
<p>Choose a password for <strong>{{.Data.Username}}</strong>. Next you'll add the account to an authenticator app.</p>
<form method="post" class="stack">
  <label>Password <input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
  <label>Password again <input name="confirm" type="password" required minlength="12" autocomplete="new-password"></label>
  <button>Continue</button>
</form>
{{end}}
