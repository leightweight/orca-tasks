{{define "intro"}}<p>Create the first account. It becomes the site administrator.</p>{{end}}
{{define "content"}}
<section class="card narrow">
  <form method="post" class="stack">
    <label>Setup code <input name="code" required autocomplete="off">
      <small data-hint>It's in the server's log, on the line that says to open this page.</small>
    </label>
    {{template "credentials" .}}
    <button>Continue</button>
  </form>
</section>
{{end}}
{{define "credentials"}}
    <label>Username <input name="username" required value="{{.Data.Username}}" autocomplete="username"></label>
    <label>Display name <input name="display_name" value="{{.Data.DisplayName}}"></label>
    <label>Password <input name="password" type="password" required minlength="12" autocomplete="new-password">
      <small data-hint>At least 12 characters.</small>
    </label>
    <label>Password again <input name="confirm" type="password" required minlength="12" autocomplete="new-password"></label>
{{end}}
