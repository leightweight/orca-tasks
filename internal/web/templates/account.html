{{define "content"}}
<section>
  <h2>Profile</h2>
  <form method="post" action="/account/profile" class="stack">
    <label>Display name <input name="display_name" required value="{{.User.DisplayName}}"></label>
    <label>Email <input name="email" type="email" value="{{.User.Email}}"></label>
    <button>Save</button>
  </form>
</section>
<section>
  <h2>Password</h2>
  <form method="post" action="/account/password" class="stack">
    <label>Current password <input name="current" type="password" required autocomplete="current-password"></label>
    <label>New password <input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
    <label>New password again <input name="confirm" type="password" required minlength="12" autocomplete="new-password"></label>
    <label>Authenticator code <input name="code" required inputmode="numeric" autocomplete="one-time-code"></label>
    <button>Change password</button>
  </form>
  <p class="note">Changing your password signs out your other sessions.</p>
</section>
<section>
  <h2>Recovery codes</h2>
  <p>You have {{.Data.RecoveryCodes}} unused recovery codes. Making new ones replaces them all.</p>
  <form method="post" action="/account/recovery-codes" class="inline">
    <label>Authenticator code <input name="code" required inputmode="numeric" autocomplete="one-time-code"></label>
    <button>Make new recovery codes</button>
  </form>
</section>
{{end}}
