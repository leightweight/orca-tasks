{{define "content"}}
<section class="card narrow">
  <form method="post" class="stack">
    <label>Code
      <input name="code" required autocomplete="one-time-code" autofocus>
      <small data-hint>The six digits from your authenticator app, or one of your recovery codes.</small>
    </label>
    <button>Sign in</button>
  </form>
</section>
{{end}}
