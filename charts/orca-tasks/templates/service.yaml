apiVersion: v1
kind: Service
metadata:
  name: {{ include "orca-tasks.fullname" . }}
  labels:
    {{- include "orca-tasks.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "orca-tasks.selectorLabels" . | nindent 4 }}
