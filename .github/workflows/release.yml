name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # A tag only publishes once lint and tests pass on its commit, since the
  # release signs what it builds.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
          cache: false
      - run: mise run lint
      - name: Check the plugin version matches the tag
        # Claude Code only updates a plugin when its version changes, so each
        # release must carry the version it's tagged with. A prerelease such as
        # v0.1.0-rc.2 expects 0.1.0.
        run: |
          want="${GITHUB_REF_NAME#v}"
          want="${want%%-*}"
          got="$(jq -r .version plugins/orca-tasks/.claude-plugin/plugin.json)"
          if [ "$got" != "$want" ]; then
            echo "::error::plugin.json says $got, but the tag $GITHUB_REF_NAME needs $want."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
          cache: false
      - run: mise run test

  release:
    name: Release
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Create the GitHub release.
      contents: write
      # Push the image and the chart to GHCR.
      packages: write
      # Sign the image and the chart with cosign's keyless signing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser needs the tags to find the previous release.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.18
          # Tag builds can read caches that runs on main wrote, so a poisoned cache could put files into a signed release.
          cache: false
          # Only what this job runs. It holds write and signing permissions, so it
          # shouldn't build Rust and the other development tools.
          install_args: go goreleaser cosign helm go:github.com/google/go-licenses/v2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build stable release notes from the last stable release
        # goreleaser compares against the previous tag, which for a stable release
        # is usually a release candidate whose notes it would leave out. A stable
        # release lists everything since the last stable one, or since the first
        # commit; a prerelease keeps the default.
        run: |
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            previous="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          fi
      - name: Release the image and the CLI
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release the Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#v}"
          chart=ghcr.io/leightweight/charts/orca-tasks
          mkdir -p .cache/release
          helm package charts/orca-tasks --version "$version" --app-version "$version" --destination .cache/release
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push ".cache/release/orca-tasks-${version}.tgz" oci://ghcr.io/leightweight/charts 2>&1 | tee .cache/release/helm-push.log
          digest="$(sed -n 's/^Digest: //p' .cache/release/helm-push.log)"
          if [ -z "$digest" ]; then echo "::error::helm push printed no digest."; exit 1; fi
          cosign sign --yes "${chart}@${digest}"

  # Signs a packslip manifest of the CLI archives, so mise can install and
  # verify them with packslip:github.com/leightweight/orca-tasks. This job
  # can't change the release; the next one uploads the signed bundle.
  packslip:
    name: Sign the packslip
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Download the release's archives.
      contents: read
      # Sign with the workflow's identity.
      id-token: write
      # Attest the archives' build provenance.
      attestations: write
    steps:
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        id: packslip
        with:
          download: orca-tasks_*.tar.gz
          bin: orca-tasks
          upload: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    name: Publish the packslip
    needs: packslip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Upload the bundle to the release.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packslip-bundle
          path: packslip
      - name: Upload the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json --repo "$GITHUB_REPOSITORY" --clobber
