version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - errorlint
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - modernize
    - nakedret
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gosec:
      excludes:
        # G203 flags every conversion to template.HTML. The only one is goldmark's
        # Markdown output with raw HTML off, which html/template can't take any
        # other way.
        - G203
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    lll:
      line-length: 160
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    sloglint:
      kv-only: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - gosec
        path: _test\.go
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/leightweight/orca-tasks
  exclusions:
    generated: lax
